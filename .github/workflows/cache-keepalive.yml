name: Cache keepalive

# GitHub evicts a cache nothing has read for seven days, and the limit is not
# raisable on a free account. Scheduled runs use the default branch, which is
# the only scope every release branch can read.
#
# A lookup counts as a read and downloads nothing. Every path below must be
# written exactly as the release job's runner sees it: the path is hashed into
# the cache entry's version, so a lookup with a differently written path
# misses, and a miss fails the job instead of refreshing nothing in silence.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-keepalive
  cancel-in-progress: true

jobs:
  linux:
    name: Linux caches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/ccache
          key: ccache-linux-x86_64-release-
          restore-keys: ccache-linux-x86_64-release-
          lookup-only: true
          fail-on-cache-miss: true

  windows:
    name: Windows caches
    # A Windows entry carries a Windows-only marker in its version.
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      TBUILD: ${{ github.workspace }}\TBuild
    steps:
      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: windows-x64-third-party-
          restore-keys: windows-x64-third-party-
          lookup-only: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6
        if: ${{ !cancelled() }}
        with:
          path: ${{ env.TBUILD }}\Libraries\win64
          key: windows-x64-release-libraries-
          restore-keys: windows-x64-release-libraries-
          lookup-only: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6
        if: ${{ !cancelled() }}
        with:
          path: ${{ env.TBUILD }}\ccache
          key: ccache-windows-x64-release-
          restore-keys: ccache-windows-x64-release-
          lookup-only: true
          fail-on-cache-miss: true
